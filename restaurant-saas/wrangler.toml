# TableQR — Cloudflare Workers Static Assets
# Serves the Vite production build (dist/) instead of the raw source tree.
# SPA fallback: all unknown routes serve /index.html (React Router).
name = "restaurant-qr-system"
compatibility_date = "2025-01-01"
main = "src/worker.js"

[assets]
directory = "./dist"
# The Worker serves SPA routes via env.ASSETS — WITHOUT this binding line
# the deployed Worker sees env.ASSETS as undefined (TypeError on every
# deep link) while / still works, because the platform serves existing
# files directly and only invokes the Worker for missing paths.
binding = "ASSETS"
not_found_handling = "single-page-application"

# Trigger rebuild with corrected build settings (root restaurant-saas, npm run build).
